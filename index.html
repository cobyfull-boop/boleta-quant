<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squeeze Predator V20 - Boleta Quant</title>
    <script src="https://telegram.org"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: #1A252C; color: #FFFFFF; font-family: 'Segoe UI', sans-serif; padding: 15px; margin: 0; }
        .card { background-color: #24343F; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h3 { margin-top: 0; color: #00FF00; font-size: 16px; border-bottom: 1px solid #34495E; padding-bottom: 5px; }
        .leg { display: flex; justify-content: space-between; margin: 8px 0; font-size: 14px; }
        .buy { color: #52BE80; } .sell { color: #EC7063; }
        .btn-submit { background-color: #00FF00; color: #000000; border: none; width: 100%; padding: 12px; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 14px; margin-top: 10px; }
        canvas { background-color: #1A252C; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h3>📊 SIMULAÇÃO DE ESTRUTURA QUANT</h3>
        <div id="info-estrutura">Carregando dados da matriz B3...</div>
    </div>

    <div class="card">
        <h3>📈 GRÁFICO DE PAYOFF (VENCIMENTO)</h3>
        <canvas id="payoffChart" width="100" height="60"></canvas>
    </div>

    <button class="btn-submit" onclick="enviarOrdemInstitucional()">⚡ ASSINAR E EXECUTAR ESTRUTURA</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Abre o Web App em tela cheia no celular

        // Simulação de dados recebidos pelo contexto do sinal
        const ativo = "PETR4";
        const strikeLong = 38.50;
        const strikeShort = 40.50;
        const premioLiquido = 0.65; // Custo da trava

        document.getElementById("info-estrutura").innerHTML = `
            <div class="leg"><b>Ativo Objeto:</b> <span>${ativo}</span></div>
            <div class="leg buy"><b>Perna Longa:</b> <span>Compra Strike R$ ${strikeLong.toFixed(2)}</span></div>
            <div class="leg sell"><b>Perna Short:</b> <span>Venda Strike R$ ${strikeShort.toFixed(2)}</span></div>
            <div class="leg"><b>Custo Máximo:</b> <span>R$ ${premioLiquido.toFixed(2)} por lote</span></div>
        `;

        // Renderização vetorial do Gráfico de Payoff de Opções
        const ctx = document.getElementById('payoffChart').getContext('2d');
        const preçosSpot = [];
        const lucros = [];

        for (let p = 35.00; p <= 44.00; p += 0.50) {
            preçosSpot.push("R\$ " + p.toFixed(2));
            // Cálculo do payoff da trava de alta em call no vencimento
            let ganhoLong = Math.max(0, p - strikeLong);
            let ganhoShort = Math.max(0, p - strikeShort);
            let resultadoNet = (ganhoLong - ganhoShort - premioLiquido) * 100; // Por lote padrão
            lucros.push(resultadoNet);
        }

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: preçosSpot,
                datasets: [{
                    label: 'Lucro / Prejuízo (R\$)',
                    data: lucros,
                    borderColor: '#00FF00',
                    backgroundColor: 'rgba(0, 255, 0, 0.05)',
                    borderWidth: 2,
                    tension: 0.1
                }]
            },
            options: {
                scales: {
                    y: { grid: { color: '#2C3E50' }, ticks: { color: '#FFF' } },
                    x: { grid: { color: '#2C3E50' }, ticks: { color: '#FFF', display: false } }
                },
                plugins: { legend: { display: false } }
            }
        });

        function enviarOrdemInstitucional() {
            const dadosBoleta = {
                action: "EXECUTE_WEBAPP_OCO",
                ativo: ativo,
                strike_long: strikeLong,
                strike_short: strikeShort,
                volume: 100,
                timestamp: Date.now()
            };
            // Envia o JSON de volta para o Python de forma segura
            tg.sendData(JSON.stringify(dadosBoleta));
            tg.close();
        }
    </script>
</body>
</html>
