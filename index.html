<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Squeeze Predator V20 - Boleta Quant</title>
    <!-- Script Oficial do Telegram com inicialização assíncrona -->
    <script src="https://telegram.org"></script>
    <style>
        body { background-color: #1A252C; color: #FFFFFF; font-family: 'Segoe UI', sans-serif; padding: 15px; margin: 0; user-select: none; }
        .card { background-color: #24343F; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h3 { margin-top: 0; color: #00FF00; font-size: 15px; border-bottom: 1px solid #34495E; padding-bottom: 6px; }
        .leg { display: flex; justify-content: space-between; margin: 10px 0; font-size: 14px; }
        .buy { color: #52BE80; font-weight: bold; } .sell { color: #EC7063; font-weight: bold; }
        .btn-submit { background-color: #00FF00; color: #000000; border: none; width: 100%; padding: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 15px; margin-top: 15px; transition: background 0.2s; }
        .btn-submit:active { background-color: #00CC00; }
        /* Desenho nativo de barras de payoff simulando o gráfico sem dependências externas */
        .payoff-container { display: flex; justify-content: space-between; align-items: flex-end; height: 100px; padding: 10px 0; border-bottom: 2px solid #34495E; }
        .bar { width: 14%; background-color: #52BE80; border-radius: 3px 3px 0 0; text-align: center; font-size: 10px; color: #FFF; }
        .bar.loss { background-color: #EC7063; border-radius: 0 0 3px 3px; transform: translateY(100%); }
    </style>
</head>
<body>

    <div class="card">
        <h3>📊 ESTRUTURA QUANT SELECIONADA</h3>
        <div id="info-estrutura">
            <div class="leg"><b>Ativo Objeto:</b> <span>PETR4</span></div>
            <div class="leg buy"><b>Perna Longa (COMPRA):</b> <span>PETRA385 (R$ 38,50)</span></div>
            <div class="leg sell"><b>Perna Short (VENDA):</b> <span>PETRA405 (R$ 40,50)</span></div>
            <div class="leg"><b>Custo da Trava:</b> <span>R$ 0,65 por opção</span></div>
        </div>
    </div>

    <div class="card">
        <h3>📈 COMPORTAMENTO DO PAYOFF (PROJEÇÃO)</h3>
        <!-- Gráfico nativo CSS ultrarrápido imune a bloqueios de rede móvel -->
        <div style="display: flex; justify-content: space-between; font-size: 11px; color: #85929E; margin-bottom: 5px;">
            <span>Abaixo de R$ 38.50 (Prejuízo)</span>
            <span>Acima de R$ 40.50 (Lucro Máx)</span>
        </div>
        <div style="height: 120px; position: relative; border-left: 2px solid #566573; border-bottom: 2px solid #566573; margin: 10px 5px;">
            <svg viewBox="0 0 100 50" style="width: 100%; height: 100%; stroke: #00FF00; stroke-width: 3; fill: rgba(0,255,0,0.05);">
                <!-- Linha matemática vetorial do Payoff da Trava de Alta -->
                <path d="M 0 45 L 35 45 L 75 10 L 100 10 L 100 50 L 0 50 Z" />
            </svg>
        </div>
    </div>

    <button class="btn-submit" onclick="enviarOrdemInstitucional()">⚡ ASSINAR E EXECUTAR ESTRUTURA</button>

    <script>
        // Informa o ecossistema do Telegram de que a interface está pronta
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function enviarOrdemInstitucional() {
            const dadosBoleta = {
                action: "EXECUTE_WEBAPP_OCO",
                ativo: "PETR4",
                strike_long: 38.50,
                strike_short: 40.50,
                volume: 100,
                timestamp: Date.now()
            };
            // Devolve os dados criptografados para o orquestrador Python
            tg.sendData(JSON.stringify(dadosBoleta));
            tg.close();
        }
    </script>
</body>
</html>
